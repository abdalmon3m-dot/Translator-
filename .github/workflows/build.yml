name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          echo "Files in repo:"
          find . -not -path './.git/*' -type f | head -50
          SETTINGS=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found. Project files were not uploaded."
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MeaningTranslate-APK
          path: "**/app-debug.apk"
