name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unzip project
        run: |
          if ls *.zip >/dev/null 2>&1; then
            unzip -q -o *.zip -d project
          fi

      - name: Build debug APK
        run: |
          SETTINGS=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          # ML Kit Arabic مش موجودة؛ نشيلها والعربي يتقرأ عن طريق Gemini
          sed -i '/text-recognition-arabic/d' app/build.gradle.kts
          F=app/src/main/java/com/example/meaningtranslate/Translate.kt
          sed -i -e '/textrecognition.arabic/d' -e '/private val arabic = /d' -e '/val arText = /d' -e '/val arCount = /d' -e '/if (arCount >= 2)/d' $F
          sed -i 's/^        return latinText$/        return ""/' $F
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MeaningTranslate-APK
          path: "**/app-debug.apk"
